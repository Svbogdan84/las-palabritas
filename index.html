<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palabritas — Spanish Flashcards</title>
<style>
  :root {
    --bg: #1B2430;
    --bg-deep: #141B24;
    --paper: #F5F1E6;
    --paper-dim: #E8E2D2;
    --panel: #22303F;
    --ink: #1B2430;
    --gold: #C99A44;
    --gold-deep: #A87E32;
    --muted: #9A9484;
    --muted-2: #C9C4B4;

    --noun: #BFE0B6;
    --noun-deep: #5E9A50;
    --noun-ink: #274420;

    --adj: #EFC0BA;
    --adj-deep: #C1685C;
    --adj-ink: #4B231E;

    --verb: #B7D3EC;
    --verb-deep: #4F7FA8;
    --verb-ink: #1F3A50;

    --other: #D9C7E8;
    --other-deep: #8E6BAE;
    --other-ink: #3A2A4A;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }

  #app {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 60px;
    min-height: 100vh;
  }

  .serif {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
  }

  /* ---------- Header ---------- */
  .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .brand {
    font-size: 26px;
    letter-spacing: 0.01em;
  }

  .brand em {
    color: var(--gold);
    font-style: normal;
  }

  .reset-link {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 4px;
  }
  .reset-link:hover { color: var(--paper); }

  .lang-switch {
    display: flex;
    gap: 6px;
  }
  .flag-btn {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    font-size: 18px;
    line-height: 1;
    padding: 6px 8px;
    cursor: pointer;
    opacity: 0.55;
    transition: opacity 0.15s ease, border-color 0.15s ease;
  }
  .flag-btn:hover { opacity: 0.85; }
  .flag-btn.flag-active {
    opacity: 1;
    border-color: var(--gold);
  }

  .lang-select-label {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
    margin-bottom: 18px;
  }

  .tally-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 30px;
  }

  .tally {
    color: var(--muted-2);
    font-size: 14px;
    margin-bottom: 0;
  }

  .tally strong { color: var(--paper); font-weight: 600; }

  .section-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted-2);
    letter-spacing: 0.03em;
    margin: 0 0 12px;
  }

  /* ---------- Picker: main category tiles ---------- */
  .tiles {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 34px;
  }

  .mix-mode-btn {
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 100%;
    margin: 0 0 34px;
    padding: 18px 22px;
    border: 1px solid var(--gold);
    border-radius: 4px;
    background: var(--panel);
    color: var(--paper);
    text-align: left;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .mix-mode-btn:hover { transform: translateY(-2px); background: var(--bg-deep); }
  .mix-mode-btn:active { transform: translateY(0); }
  .mix-mode-title { font-size: 1.35rem; }
  .mix-mode-sub { color: var(--muted-2); font-size: 0.85rem; }

  .tile {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    border-radius: 4px;
    padding: 22px 24px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s ease;
  }
  .tile:hover { transform: translateY(-2px); }
  .chip-mix { background: var(--gold); color: var(--ink); }
  .tile:active { transform: translateY(0); }

  .tile-noun { background: var(--noun); color: var(--noun-ink); }
  .tile-adjective { background: var(--adj); color: var(--adj-ink); }
  .tile-verb { background: var(--verb); color: var(--verb-ink); }
  .tile-other { background: var(--other); color: var(--other-ink); }

  .tile-es {
    font-size: 24px;
    margin: 0 0 2px;
  }

  .tile-en {
    font-size: 13px;
    opacity: 0.75;
    margin: 0 0 16px;
  }

  .tile-progress-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 6px;
  }

  .tile-bar-track {
    height: 6px;
    border-radius: 3px;
    background: rgba(0,0,0,0.14);
    overflow: hidden;
  }

  .tile-bar-fill { height: 100%; border-radius: 3px; }
  .tile-noun .tile-bar-fill { background: var(--noun-deep); }
  .tile-adjective .tile-bar-fill { background: var(--adj-deep); }
  .tile-verb .tile-bar-fill { background: var(--verb-deep); }
  .tile-other .tile-bar-fill { background: var(--other-deep); }

  .tile-check {
    position: absolute;
    top: 18px;
    right: 20px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
  }

  /* ---------- Picker: topic (sub-category) grid ---------- */
  .topics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .topic-tile {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 6px;
    padding: 16px 14px;
    text-align: left;
    cursor: pointer;
    color: var(--paper);
    position: relative;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .topic-tile:hover { transform: translateY(-2px); border-color: rgba(201,154,68,0.5); }
  .topic-tile:active { transform: translateY(0); }

  .topic-icon { font-size: 20px; margin-bottom: 8px; display: block; }

  .topic-es {
    font-size: 15px;
    margin: 0;
    font-weight: 600;
  }

  .topic-en {
    font-size: 11px;
    color: var(--muted-2);
    margin: 0 0 10px;
  }

  .topic-count {
    font-size: 11px;
    color: var(--muted-2);
    margin-bottom: 5px;
  }

  .topic-bar-track {
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
  }
  .topic-bar-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--gold);
  }

  .topic-check {
    position: absolute;
    top: 12px;
    right: 12px;
    font-size: 10px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.02em;
  }

  /* ---------- Session screen ---------- */
  .session-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }

  .back-btn {
    background: none;
    border: none;
    color: var(--muted-2);
    font-size: 14px;
    cursor: pointer;
    padding: 6px 0;
  }
  .back-btn:hover { color: var(--paper); }

  .cat-chip {
    font-size: 12px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 999px;
    letter-spacing: 0.02em;
  }
  .chip-noun { background: var(--noun); color: var(--noun-ink); }
  .chip-adjective { background: var(--adj); color: var(--adj-ink); }
  .chip-verb { background: var(--verb); color: var(--verb-ink); }
  .chip-other { background: var(--other); color: var(--other-ink); }
  .chip-sub { background: var(--gold); color: var(--bg-deep); }

  .session-bar-track {
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.1);
    margin-bottom: 40px;
    overflow: hidden;
  }
  .session-bar-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 2px;
    transition: width 0.25s ease;
  }

  .card-wrap {
    perspective: 1200px;
    margin-bottom: 22px;
  }

  .card {
    position: relative;
    height: 300px;
    border-radius: 10px;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
  }
  .card.flipped { transform: rotateY(180deg); }

  .card:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 5px;
    border-radius: 10px;
  }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
    background: var(--paper);
    color: var(--ink);
    padding: 22px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }

  .card-back { transform: rotateY(180deg); }

  .card-word {
    font-size: 34px;
    margin: 0;
    line-height: 1.15;
  }

  .card-example {
    margin: 16px 0 0;
    font-size: 14px;
    font-style: italic;
    color: #5C5646;
    max-width: 90%;
    line-height: 1.4;
  }

  .card-hint {
    margin-top: 14px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .card-cat-label {
    position: absolute;
    top: 16px;
    left: 18px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--muted);
  }

  .actions {
    display: flex;
    gap: 12px;
  }

  .btn {
    flex: 1;
    padding: 15px;
    border-radius: 6px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .btn-skip {
    background: transparent;
    color: var(--paper);
    border: 1px solid rgba(255,255,255,0.25);
  }
  .btn-skip:not(:disabled):hover { border-color: var(--paper); }

  .btn-learned {
    background: var(--gold);
    color: var(--bg-deep);
  }
  .btn-learned:not(:disabled):hover { background: var(--gold-deep); }

  /* ---------- Complete screen ---------- */
  .complete {
    text-align: center;
    padding: 60px 10px;
  }

  .complete-title {
    font-size: 30px;
    margin: 0 0 10px;
  }

  .complete-sub {
    color: var(--muted-2);
    font-size: 15px;
    margin-bottom: 36px;
  }

  .complete-actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 260px;
    margin: 0 auto;
  }

  .btn-primary {
    background: var(--gold);
    color: var(--bg-deep);
    border: none;
    padding: 14px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary:hover { background: var(--gold-deep); }

  .btn-secondary {
    background: transparent;
    color: var(--paper);
    border: 1px solid rgba(255,255,255,0.25);
    padding: 14px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-secondary:hover { border-color: var(--paper); }

  .loading {
    text-align: center;
    color: var(--muted-2);
    padding: 80px 0;
    font-size: 14px;
  }

  @media (min-width: 560px) {
    .tiles { flex-direction: row; flex-wrap: wrap; }
    .tile { flex: 1 1 calc(50% - 7px); }
    .topics { grid-template-columns: repeat(3, 1fr); }
  }

  .app-version {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.02em;
    padding: 18px 0 6px;
  }

  .storage-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--adj-deep);
    color: var(--paper);
    font-size: 13px;
    line-height: 1.4;
    padding: 12px 14px;
    border-radius: 6px;
    margin-bottom: 18px;
  }

  .storage-banner-close {
    flex-shrink: 0;
    background: none;
    border: none;
    color: var(--paper);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 6px;
    opacity: 0.85;
  }
  .storage-banner-close:hover { opacity: 1; }
</style>
</head>

    { id: "ex10", cat: "emotions", es: "la culpa", en: "guilt", uk: "провина", ru: "вина", ex: "Me gusta la culpa." },
    { id: "ex11", cat: "emotions", es: "el orgullo", en: "pride", uk: "гордість", ru: "гордость", ex: "Me gusta el orgullo." },
    { id: "ex14", cat: "emotions", es: "el estrés", en: "stress", uk: "стрес", ru: "стресс", ex: "Me gusta el estrés." },
    { id: "ex15", cat: "emotions", es: "la preocupación", en: "worry", uk: "занепокоєння", ru: "беспокойство", ex: "Me gusta la preocupación." },
    { id: "ex16", cat: "emotions", es: "la felicidad", en: "happiness", uk: "щастя", ru: "счастье", ex: "Me gusta la felicidad." },
    { id: "ex17", cat: "emotions", es: "la satisfacción", en: "satisfaction", uk: "задоволення", ru: "удовлетворение", ex: "Me gusta la satisfacción." },
    { id: "ex18", cat: "emotions", es: "la decepción", en: "disappointment", uk: "розчарування", ru: "разочарование", ex: "Me gusta la decepción." },
    { id: "ex19", cat: "emotions", es: "la frustración", en: "frustration", uk: "фрустрація", ru: "фрустрация", ex: "Me gusta la frustración." },
    { id: "ex20", cat: "emotions", es: "la soledad", en: "loneliness", uk: "самотність", ru: "одиночество", ex: "Me gusta la soledad." },
    { id: "ex21", cat: "emotions", es: "el entusiasmo", en: "enthusiasm", uk: "ентузіазм", ru: "энтузиазм", ex: "Me gusta el entusiasmo." },
    { id: "ex22", cat: "emotions", es: "la curiosidad", en: "curiosity", uk: "цікавість", ru: "любопытство", ex: "Me gusta la curiosidad." },
    { id: "ex23", cat: "emotions", es: "la paciencia", en: "patience", uk: "терпіння", ru: "терпение", ex: "Me gusta la paciencia." },
    { id: "ex24", cat: "emotions", es: "la impaciencia", en: "impatience", uk: "нетерпіння", ru: "нетерпение", ex: "Me gusta la impaciencia." },
    { id: "ex25", cat: "emotions", es: "el alivio", en: "relief", uk: "полегшення", ru: "облегчение", ex: "Me gusta el alivio." },
    { id: "ex26", cat: "emotions", es: "la gratitud", en: "gratitude", uk: "вдячність", ru: "благодарность", ex: "Me gusta la gratitud." },
    { id: "ex27", cat: "emotions", es: "el cariño", en: "affection", uk: "прихильність", ru: "привязанность", ex: "Me gusta el cariño." },
    { id: "ex28", cat: "emotions", es: "la admiración", en: "admiration", uk: "захоплення", ru: "восхищение", ex: "Me gusta la admiración." },
    { id: "ex29", cat: "emotions", es: "la compasión", en: "compassion", uk: "співчуття", ru: "сострадание", ex: "Me gusta la compasión." },
    { id: "ex30", cat: "emotions", es: "la emoción", en: "emotion", uk: "емоція", ru: "эмоция", ex: "Me gusta la emoción." },
  ];

  const STORAGE_KEY = "learned-word-ids";
  const LANG_KEY = "ui-language";

  // Use window.storage when running as a Claude Artifact; otherwise fall
  // back to localStorage so the app also works as a standalone HTML file.
  const hasArtifactStorage = typeof window !== "undefined" &&
    window.storage &&
    typeof window.storage.get === "function" &&
    typeof window.storage.set === "function";

  async function storageGet(key) {
    if (hasArtifactStorage) {
      return window.storage.get(key, false);
    }
    const value = localStorage.getItem(key);
    return value === null ? null : { key, value, shared: false };
  }

  async function storageSet(key, value) {
    if (hasArtifactStorage) {
      return window.storage.set(key, value, false);
    }
    localStorage.setItem(key, value);
    return { key, value, shared: false };
  }

  let learned = {};        // { wordId: true }
  let storageReady = false;
  let lang = "en";          // "en" | "uk"
  let storageError = null;  // null | "load" | "save"

  let view = "picker";     // "picker" | "session" | "complete"
  let activeCat = null;
  let queue = [];          // word objects remaining this session
  let current = null;
  let flipped = false;
  let sessionTotal = 0;    // queue length at session start (for progress bar)

  function t() { return UI[lang]; }
  function transOf(word) { return word[lang] || word.en; }
  function catName(c) { return c[lang] || c.en; }

  function wordsByCat(cat) {
    if (cat === "mix") return WORDS;
    return WORDS.filter(w => w.cat === cat);
  }

  function learnedCountFor(cat) {
    return wordsByCat(cat).filter(w => learned[w.id]).length;
  }

  function totalLearned() {
    return Object.keys(learned).length;
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  async function loadProgress() {
    let hadError = false;
    try {
      const res = await storageGet(STORAGE_KEY);
      if (res && res.value) {
        learned = JSON.parse(res.value);
      }
    } catch (e) {
      learned = {};
      hadError = true;
    }
    try {
      const langRes = await storageGet(LANG_KEY);
      if (langRes && langRes.value && ["en","uk","ru"].includes(langRes.value)) {
        lang = langRes.value;
      }
    } catch (e) {
      lang = "en";
      hadError = true;
    }
    if (hadError) storageError = "load";
    storageReady = true;
    render();
  }

  async function saveLang() {
    try {
      await storageSet(LANG_KEY, lang);
    } catch (e) {
      console.error("Could not save language", e);
      storageError = "save";
      render();
    }
  }

  function setLang(newLang) {
    if (lang === newLang) return;
    lang = newLang;
    saveLang();
    render();
  }

  async function saveProgress() {
    try {
      await storageSet(STORAGE_KEY, JSON.stringify(learned));
      if (storageError === "save") {
        storageError = null;
        render();
      }
    } catch (e) {
      console.error("Could not save progress", e);
      storageError = "save";
      render();
    }
  }

  async function resetProgress() {
    if (!confirm(t().resetConfirm)) return;
    learned = {};
    await saveProgress();
    view = "picker";
    render();
  }

  function startSession(cat, reviewAll) {
    activeCat = cat;
    const all = wordsByCat(cat);
    const pool = reviewAll ? all : all.filter(w => !learned[w.id]);
    if (pool.length === 0) {
      view = "complete";
      render();
      return;
    }
    queue = shuffle(pool);
    sessionTotal = queue.length;
    current = queue[0];
    flipped = false;
    view = "session";
    render();
  }

  function markLearned() {
    learned[current.id] = true;
    saveProgress();
    advance();
  }

  function markSkip() {
    queue.shift();
    queue.push(current);
    nextCard();
  }

  function advance() {
    queue.shift();
    nextCard();
  }

  function nextCard() {
    flipped = false;
    if (queue.length === 0) {
      view = "complete";
      render();
      return;
    }
    current = queue[0];
    render();
  }

  function goToPicker() {
    view = "picker";
    render();
  }

  function esc(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function renderPicker() {
    const total = WORDS.length;
    const tt = totalLearned();
    const ui = t();

    const mainKeys = Object.keys(CATEGORIES).filter(k => CATEGORIES[k].group === "main");
    const subKeys = Object.keys(CATEGORIES).filter(k => CATEGORIES[k].group === "sub");

    let html = `
      <div class="top">
        <div class="brand serif"><em>Pala</em>britas</div>
        <div class="lang-switch">
          <button class="flag-btn ${lang === 'en' ? 'flag-active' : ''}" id="lang-en" title="English" aria-label="English">🇺🇸</button>
          <button class="flag-btn ${lang === 'uk' ? 'flag-active' : ''}" id="lang-uk" title="Українська" aria-label="Українська">🇺🇦</button>
          <button class="flag-btn ${lang === 'ru' ? 'flag-active' : ''}" id="lang-ru" title="Русский" aria-label="Русский">🇷🇺</button>
        </div>
      </div>
      <div class="lang-select-label">${lang === 'uk' ? 'Оберіть мову:' : (lang === 'ru' ? 'Выберите язык:' : 'Select language:')}</div>
      <div class="tally-row">
        <div class="tally">${ui.totalLearned} <strong>${tt} / ${total}</strong></div>
        <button class="reset-link" id="reset-btn">${ui.resetProgress}</button>
      </div>

      <button class="mix-mode-btn" data-cat="mix">
        <span class="mix-mode-title serif">${ui.mixModeTitle}</span>
        <span class="mix-mode-sub">${ui.mixModeSub(total)}</span>
      </button>

      <p class="section-label">${ui.mainCategories}</p>
      <div class="tiles">
    `;
    for (const key of mainKeys) {
      const c = CATEGORIES[key];
      const catWords = wordsByCat(key);
      const done = learnedCountFor(key);
      const pct = Math.round((done / catWords.length) * 100);
      html += `
        <button class="tile tile-${c.cls}" data-cat="${key}">
          ${done === catWords.length ? `<span class="tile-check">${ui.done}</span>` : ''}
          <p class="tile-es serif">${c.es}</p>
          <p class="tile-en">${catName(c)}</p>
          <div class="tile-progress-row">
            <span>${ui.learnedOf(done, catWords.length)}</span>
          </div>
          <div class="tile-bar-track"><div class="tile-bar-fill" style="width:${pct}%"></div></div>
        </button>
      `;
    }
    html += `</div>`;

    html += `<p class="section-label">${ui.topics}</p><div class="topics">`;
    for (const key of subKeys) {
      const c = CATEGORIES[key];
      const catWords = wordsByCat(key);
      const done = learnedCountFor(key);
      const pct = Math.round((done / catWords.length) * 100);
      html += `
        <button class="topic-tile" data-cat="${key}">
          ${done === catWords.length ? '<span class="topic-check">✓</span>' : ''}
          <span class="topic-icon">${c.icon}</span>
          <p class="topic-es serif">${c.es}</p>
          <p class="topic-en">${catName(c)}</p>
          <div class="topic-count">${done} / ${catWords.length}</div>
          <div class="topic-bar-track"><div class="topic-bar-fill" style="width:${pct}%"></div></div>
        </button>
      `;
    }
    html += `</div>`;

    document.getElementById("app").innerHTML = html;

    document.getElementById("reset-btn") && document.getElementById("reset-btn").addEventListener("click", resetProgress);
    document.getElementById("lang-en").addEventListener("click", () => setLang("en"));
    document.getElementById("lang-uk").addEventListener("click", () => setLang("uk"));
    document.getElementById("lang-ru").addEventListener("click", () => setLang("ru"));
    document.querySelectorAll(".tile, .topic-tile, .mix-mode-btn").forEach(el => {
      el.addEventListener("click", () => startSession(el.dataset.cat, false));
    });
  }

  function renderSession() {
    const c = activeCat === "mix"
      ? { es: "Mezcla", en: "Mix mode", uk: "Мікс", ru: "Микс", cls: "mix", group: "main" }
      : CATEGORIES[activeCat];
    const chipCls = activeCat === "mix" ? "mix" : (c.group === "main" ? c.cls : "sub");
    const doneInSession = sessionTotal - queue.length;
    const pct = Math.round((doneInSession / sessionTotal) * 100);
    const ui = t();

    const html = `
      <div class="session-top">
        <button class="back-btn" id="back-btn">${ui.backToCategories}</button>
        <span class="cat-chip chip-${chipCls}">${c.icon ? c.icon + ' ' : ''}${c.es}</span>
      </div>
      <div class="session-bar-track"><div class="session-bar-fill" style="width:${pct}%"></div></div>

      <div class="card-wrap">
        <div class="card ${flipped ? 'flipped' : ''}" id="card" role="button" tabindex="0"
             aria-pressed="${flipped}" aria-label="${esc(flipped ? transOf(current) + '. ' + ui.tapToFlipBack : current.es + '. ' + ui.tapToReveal)}">
          <div class="card-face card-front">
            <span class="card-cat-label">${catName(c).toUpperCase()}</span>
            <p class="card-word serif">${esc(current.es)}</p>
            <p class="card-hint">${ui.tapToReveal}</p>
          </div>
          <div class="card-face card-back">
            <span class="card-cat-label">${ui.englishLabel}</span>
            <p class="card-word serif">${esc(transOf(current))}</p>
            <p class="card-example">${esc(current.ex)}</p>
            <p class="card-hint">${ui.tapToFlipBack}</p>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-skip" id="skip-btn" ${flipped ? '' : 'disabled'}>${ui.skip}</button>
        <button class="btn btn-learned" id="learned-btn" ${flipped ? '' : 'disabled'}>${ui.knowThis}</button>
      </div>
    `;
    document.getElementById("app").innerHTML = html;

    document.getElementById("back-btn").addEventListener("click", goToPicker);
    const cardEl = document.getElementById("card");
    cardEl.addEventListener("click", () => {
      flipped = !flipped;
      render();
    });
    cardEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
        e.preventDefault();
        flipped = !flipped;
        render();
      }
    });
    document.getElementById("skip-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      markSkip();
    });
    document.getElementById("learned-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      markLearned();
    });
  }

  function renderComplete() {
    const c = activeCat === "mix"
      ? { es: "Mezcla", en: "Mix mode", uk: "Мікс", ru: "Микс" }
      : CATEGORIES[activeCat];
    const ui = t();
    const html = `
      <div class="complete">
        <p class="complete-title serif">${ui.excellent}</p>
        <p class="complete-sub">${ui.learnedAllIn(wordsByCat(activeCat).length, catName(c))}</p>
        <div class="complete-actions">
          <button class="btn-primary" id="picker-btn">${ui.backToCategoriesBtn}</button>
          <button class="btn-secondary" id="review-btn">${ui.reviewAgain}</button>
        </div>
      </div>
    `;
    document.getElementById("app").innerHTML = html;
    document.getElementById("picker-btn").addEventListener("click", goToPicker);
    document.getElementById("review-btn").addEventListener("click", () => startSession(activeCat, true));
  }

  function renderStorageBanner() {
    const app = document.getElementById("app");
    if (!app || !storageError) return;
    const ui = t();
    const msg = storageError === "load" ? ui.loadError : ui.saveError;
    const el = document.createElement("div");
    el.className = "storage-banner";
    el.setAttribute("role", "alert");
    el.innerHTML = `<span>${esc(msg)}</span><button class="storage-banner-close" aria-label="${esc(ui.dismiss)}">✕</button>`;
    app.insertBefore(el, app.firstChild);
    el.querySelector(".storage-banner-close").addEventListener("click", () => {
      storageError = null;
      render();
    });
  }

  function render() {
    if (!storageReady) return;
    if (view === "picker") renderPicker();
    else if (view === "session") renderSession();
    else if (view === "complete") renderComplete();
    renderStorageBanner();
  }

  loadProgress();
})();
</script>
</body>
</html>
